<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>삶의 나침반 · Life Compass</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#20352f;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:22px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}h1{font-size:28px;margin:4px 0}h2{font-size:19px;margin:0 0 14px}.sub,.muted{color:#64766e;font-size:13px}.card{background:white;border:1px solid #dfe7e1;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #223a2b07}.hero{background:#dfece3}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.tabs button{white-space:nowrap}button{border:0;border-radius:11px;background:#e8eee9;padding:11px 15px;color:#234337;font-weight:650;cursor:pointer}button.primary,.tabs button.active{background:#286c53;color:white}button.danger{color:#a43232;background:#fcecec}input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #cddbd1;border-radius:10px;background:#fff;margin:6px 0 14px}textarea{min-height:100px;resize:vertical}label{font-weight:650;font-size:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{border-top:1px solid #e5ece6;padding:14px 0}.item:first-child{border-top:0}.pill{display:inline-block;border-radius:30px;background:#eaf2eb;padding:5px 9px;font-size:12px;margin:3px}.hidden{display:none}.note{border-left:3px solid #7c9f8a;padding:10px 12px;background:#f1f7f2;font-size:14px}.question{padding:12px;border-radius:10px;background:#f2f6f3;margin:9px 0}small{color:#66796c}.footer{font-size:12px;color:#697b70;margin-top:25px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#254a3a;color:white;padding:10px 18px;border-radius:12px;display:none;max-width:90vw} @media(min-width:600px){.app{padding-top:35px}}</style></head><body><main class="app"><header><div><div class="sub">PERSONAL LIFE COMPASS · MVP 0.1</div><h1>삶의 나침반</h1><div class="muted">기억에서 발견으로, 발견에서 선택으로</div></div><span style="font-size:35px">🧭</span></header><nav class="tabs" id="tabs"><button data-tab="home" class="active">오늘</button><button data-tab="memory">기억</button><button data-tab="discover">발견</button><button data-tab="choice">선택</button><button data-tab="review">돌아보기</button><button data-tab="settings">내 데이터</button></nav><section id="view"></section><p class="footer">이 버전은 외부 AI 서비스에 연결하지 않습니다. 기록은 현재 브라우저의 로컬 저장소에 보관됩니다. 공용 기기나 민감정보 입력에 사용하지 마세요. 저장소 삭제 또는 브라우저 변경 시 데이터가 사라질 수 있습니다.</p></main><div id="toast" role="status"></div><script>
const KEY='life_compass_mvp_01';let state={memories:[],choices:[],reviews:[]};try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.memories)&&Array.isArray(v.choices)&&Array.isArray(v.reviews))state=v}catch{}let tab='home';const $=s=>document.querySelector(s);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>new Date(s).toLocaleDateString('ko-KR');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const toast=s=>{let el=$('#toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2200)};const tags=['보람','배움','자율성','안정','관계','휴식','창작','도전','건강','기여'];function switchTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo(0,0)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));function box(title,body,extra=''){return `<article class="card ${extra}"><h2>${title}</h2>${body}</article>`}function render(){let html='';if(tab==='home'){html=box('오늘의 작은 질문',`<p>최근 마음에 남은 순간은 무엇인가요? 그 순간이 나에게 중요한 이유를 한 문장으로 남겨보세요.</p><button class="primary" onclick="switchTab('memory')">경험 기록하기 →</button>`,'hero')+box('나의 실험 현황',`<div class="row"><span class="pill">기억 ${state.memories.length}개</span><span class="pill">선택 ${state.choices.length}개</span><span class="pill">회고 ${state.reviews.length}개</span></div><p class="muted">처음 목표: 기록 30개, 선택 실험 4개</p>`)+box('이 앱이 지키는 약속','<p>AI가 당신을 정의하거나 대신 결정하지 않습니다. 기록에 근거한 질문을 제공하고, 최종 선택과 해석은 당신에게 남겨둡니다.</p>')}
if(tab==='memory'){html=box('경험 하나 남기기',`<form id="memoryForm"><label>오늘 기억하고 싶은 경험</label><textarea name="story" required maxlength="3000" placeholder="무슨 일이 있었나요? 무엇이 마음에 남았나요?"></textarea><label>그때의 감정</label><select name="feeling"><option>기쁨</option><option>평온</option><option>보람</option><option>걱정</option><option>답답함</option><option>슬픔</option><option>설렘</option><option>복합적인 감정</option></select><label>연결되는 가치</label><select name="value">${tags.map(x=>`<option>${x}</option>`).join('')}</select><label>이 경험이 나에게 말해 주는 것</label><textarea name="meaning" maxlength="2000" placeholder="아직 잘 모르겠다면 비워 두어도 됩니다."></textarea><button class="primary" type="submit">기억 저장</button></form>`)+box('나의 기억',state.memories.length?state.memories.slice().reverse().map(m=>`<div class="item"><small>${fmt(m.date)} · ${escapeHtml(m.feeling)} · ${escapeHtml(m.value)}</small><p>${escapeHtml(m.story)}</p>${m.meaning?`<p class="muted">내 해석: ${escapeHtml(m.meaning)}</p>`:''}<button onclick="removeItem('memories','${m.id}')">삭제</button></div>`).join(''):'<p class="muted">아직 기록이 없습니다.</p>')}
if(tab==='discover'){const counts=Object.fromEntries(tags.map(t=>[t,0]));state.memories.forEach(m=>{if(counts[m.value]!==undefined)counts[m.value]++});const ranked=Object.entries(counts).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);html=box('내 기록에서 발견한 단서',ranked.length?`<p>가장 자주 선택한 가치 태그입니다. <strong>이는 성격 분석이나 확정된 선호가 아닙니다.</strong></p>${ranked.map(([t,n])=>`<div class="item"><strong>${escapeHtml(t)}</strong> · ${n}회</div>`).join('')}`:'<p>기억을 기록하면 내가 직접 붙인 가치 태그의 분포가 표시됩니다.</p>')+box('나에게 던질 질문',`<div class="question">어떤 경험이 나에게 가장 오래 남았나요? 왜 그랬을까요?</div><div class="question">반복해서 선택한 가치와 실제로 시간을 쓰는 일이 일치하나요?</div><div class="question">아직 기록에 나타나지 않은 새로운 관심은 무엇일까요?</div><p class="muted">질문은 일반적인 성찰 질문입니다. 자동 심리 진단이 아닙니다.</p>`)}
if(tab==='choice'){html=box('지금 고민하는 선택',`<form id="choiceForm"><label>현재 고민</label><textarea name="problem" required maxlength="2000" placeholder="예: 현장 활동과 개인 프로젝트 사이에서 시간을 어떻게 배분할까?"></textarea><label>생각하고 있는 선택지 (한 줄에 하나씩)</label><textarea name="options" required maxlength="2000" placeholder="현재 방식 유지\n주 1회 새 프로젝트 실험\n일정 기간 집중해 보기"></textarea><label>내가 중요하게 생각하는 기준</label><input name="criteria" maxlength="500" placeholder="예: 자율성, 안정성, 보람"><button class="primary" type="submit">선택 탐색 시작</button></form>`)+box('선택 탐색 기록',state.choices.length?state.choices.slice().reverse().map(c=>`<div class="item"><small>${fmt(c.date)}</small><p><strong>${escapeHtml(c.problem)}</strong></p>${c.options.map((o,i)=>`<div class="question">${i+1}. ${escapeHtml(o)}</div>`).join('')}<p class="muted">중요 기준: ${escapeHtml(c.criteria||'미정')}</p><p class="note">무엇을 얻고 무엇을 포기하게 될까요? 되돌릴 수 있는 작은 실험은 무엇일까요? 과거 경험이 새로운 가능성을 가로막고 있지는 않나요?</p><button onclick="removeItem('choices','${c.id}')">삭제</button></div>`).join(''):'<p class="muted">아직 선택 기록이 없습니다.</p>')}
if(tab==='review'){html=box('선택 이후 돌아보기',`<form id="reviewForm"><label>어떤 선택을 실행했나요?</label><textarea name="action" required maxlength="1500"></textarea><label>무엇을 경험했나요?</label><textarea name="result" required maxlength="2000"></textarea><label>다음에는 무엇을 다르게 해보고 싶나요?</label><textarea name="next" maxlength="1500"></textarea><button class="primary" type="submit">회고 저장</button></form>`)+box('회고 기록',state.reviews.length?state.reviews.slice().reverse().map(r=>`<div class="item"><small>${fmt(r.date)}</small><p><strong>${escapeHtml(r.action)}</strong></p><p>${escapeHtml(r.result)}</p><p class="muted">다음 실험: ${escapeHtml(r.next||'미정')}</p><button onclick="removeItem('reviews','${r.id}')">삭제</button></div>`).join(''):'<p class="muted">아직 회고가 없습니다.</p>')}
if(tab==='settings'){html=box('내 기록 내보내기',`<p>데이터를 JSON 파일로 내려받아 개인적으로 보관할 수 있습니다.</p><button class="primary" id="export">JSON 백업 다운로드</button>`)+box('백업 가져오기',`<p class="muted">이 앱에서 내보낸 JSON만 선택하세요. 가져오기는 현재 기록을 대체합니다.</p><input type="file" id="import" accept=".json,application/json">`)+box('전체 기록 삭제',`<p>현재 브라우저에 저장된 모든 기록을 지웁니다.</p><button class="danger" id="clear">전체 삭제</button>`)}$('#view').innerHTML=html;bind()}
function bind(){let f=$('#memoryForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);state.memories.push({id:uid(),date:new Date().toISOString(),story:d.get('story').trim(),feeling:d.get('feeling'),value:d.get('value'),meaning:d.get('meaning').trim()});save();render();toast('기억을 저장했습니다')};f=$('#choiceForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);let opts=d.get('options').split('\n').map(x=>x.trim()).filter(Boolean);if(opts.length<2){alert('선택지를 두 개 이상 적어주세요.');return}state.choices.push({id:uid(),date:new Date().toISOString(),problem:d.get('problem').trim(),options:opts,criteria:d.get('criteria').trim()});save();render();toast('선택 탐색을 저장했습니다')};f=$('#reviewForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);state.reviews.push({id:uid(),date:new Date().toISOString(),action:d.get('action').trim(),result:d.get('result').trim(),next:d.get('next').trim()});save();render();toast('회고를 저장했습니다')};if($('#export'))$('#export').onclick=()=>{let b=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='life-compass-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('#import'))$('#import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!['memories','choices','reviews'].every(k=>Array.isArray(d[k])))throw Error('형식 오류');if(!confirm('현재 데이터를 백업 파일로 대체할까요?'))return;state={memories:d.memories,choices:d.choices,reviews:d.reviews};save();render();toast('백업을 가져왔습니다')}catch{alert('올바른 백업 파일인지 확인해 주세요.')}};if($('#clear'))$('#clear').onclick=()=>{if(confirm('모든 기록을 영구 삭제할까요?')){state={memories:[],choices:[],reviews:[]};save();render();toast('삭제했습니다')}}}
function removeItem(type,id){if(!confirm('이 기록을 삭제할까요?'))return;state[type]=state[type].filter(x=>x.id!==id);save();render()}render();
</script></body></html>
